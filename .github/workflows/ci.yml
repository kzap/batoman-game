name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit, replay, build (typecheck + validate + budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run test:replay
      - run: npm run build
      - run: npm run check:prod-bundle
      - run: npm run build:e2e
      - run: npm run check:e2e-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  perf:
    name: Playwright perf
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:perf
        env:
          CI: 'true'
      - name: Write perf job summary
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const out = process.env.GITHUB_STEP_SUMMARY;
          if (!out) process.exit(0);
          if (!existsSync('perf-results.json')) {
            appendFileSync(out, '## Frame budget\n\nNo perf-results.json. The measurement did not finish.\n');
            process.exit(0);
          }
          const r = JSON.parse(readFileSync('perf-results.json', 'utf8'));
          appendFileSync(out, [
            '## Frame budget',
            '',
            '| fps | ticks/s | dropped | lastFrameMs |',
            '| --- | --- | --- | --- |',
            `| ${r.fps} | ${r.ticksPerSecond} | ${r.dropped} | ${r.lastFrameMs} |`,
            '',
            `Floor: fps > ${r.minFps}, ticks/s > ${r.minTicksPerSecond}.`,
            '',
          ].join('\n'));
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
          retention-days: 14
